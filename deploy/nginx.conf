server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/svg+xml text/plain application/xml;

  # Sets $frame_origins from CASINO_FRAME_ORIGINS at start-up: the game providers' origins the casino may frame.
  include /tmp/frame-origins.conf;

  # React Native Web writes styles at runtime, so inline styles are allowed. The export has no inline scripts, so
  # scripts are same-origin files only (which also covers Cloudflare's /cdn-cgi scripts), plus its analytics beacon.
  set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-src 'self' $frame_origins; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
